name = "checkout-events-pixel"
type = "web_pixel_extension"
uid = "f0148fe6-95ea-1a63-02e1-562c3af5ba86cd89695c"

runtime_context = "strict"

[customer_privacy]
analytics = true
marketing = false
preferences = false
sale_of_data = "disabled"

[settings]
type = "object"

[settings.fields.collectorEndpoint]
name = "Collector endpoint"
description = "Public HTTPS URL that receives privacy-safe checkout events"
type = "single_line_text_field"
validations =  [
  { name = "min", value = "8" }
]
